<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Интерактивная шкала истории Православной Церкви</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
  :root {
    --bg-dark: #1a1410;
    --bg-panel: #241c16;
    --gold: #c9a961;
    --gold-bright: #e6c878;
    --red: #8b2635;
    --text: #e8dcc4;
    --text-dim: #a89878;
    --border: #3a2e24;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Georgia', 'Times New Roman', serif;
    background: var(--bg-dark);
    color: var(--text);
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* ===== ЛЕВАЯ ПАНЕЛЬ — ДЕРЕВО ===== */
  #sidebar {
    width: 320px;
    background: var(--bg-panel);
    border-right: 2px solid var(--gold);
    padding: 20px 15px;
    overflow-y: auto;
    flex-shrink: 0;
  }

  #sidebar h2 {
    color: var(--gold-bright);
    font-size: 18px;
    text-align: center;
    margin-bottom: 20px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
    letter-spacing: 1px;
  }

  .tree-epoch {
    margin-bottom: 12px;
  }

  .tree-epoch-title {
    color: var(--gold);
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
    padding: 8px 10px;
    background: rgba(201, 169, 97, 0.08);
    border-left: 3px solid var(--gold);
    border-radius: 2px;
    transition: all 0.2s;
    user-select: none;
  }

  .tree-epoch-title:hover {
    background: rgba(201, 169, 97, 0.18);
    color: var(--gold-bright);
  }

  .tree-epoch-title::before {
    content: "☦ ";
    color: var(--red);
  }

  .tree-events {
    list-style: none;
    padding-left: 15px;
    margin-top: 5px;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s ease;
  }

  .tree-events.open {
    max-height: 2000px;
  }

  .tree-event {
    padding: 6px 10px;
    font-size: 13px;
    color: var(--text-dim);
    cursor: pointer;
    border-left: 1px dashed var(--border);
    transition: all 0.2s;
  }

  .tree-event:hover {
    color: var(--gold-bright);
    border-left-color: var(--gold);
    padding-left: 15px;
  }

  .tree-event.active {
    color: var(--gold-bright);
    background: rgba(139, 38, 53, 0.2);
    border-left-color: var(--red);
  }

  /* ===== ЦЕНТРАЛЬНАЯ ПАНЕЛЬ — ТАЙМЛАЙН ===== */
  #main {
    flex: 1;
    overflow-y: auto;
    padding: 40px 60px;
    position: relative;
  }

  #main h1 {
    color: var(--gold-bright);
    text-align: center;
    font-size: 28px;
    margin-bottom: 10px;
    letter-spacing: 2px;
  }

  #main .subtitle {
    text-align: center;
    color: var(--text-dim);
    font-style: italic;
    margin-bottom: 50px;
    font-size: 14px;
  }

  .timeline {
    position: relative;
    max-width: 900px;
    margin: 0 auto;
    padding: 20px 0;
  }

  .timeline::before {
    content: '';
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 2px;
    background: linear-gradient(to bottom, transparent, var(--gold), var(--gold), transparent);
    transform: translateX(-50%);
  }

  .epoch-marker {
    position: relative;
    text-align: center;
    margin: 60px 0 30px 0;
    z-index: 2;
  }

  .epoch-node {
    display: inline-block;
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--red), #5a1820);
    border: 3px solid var(--gold-bright);
    box-shadow: 0 0 20px rgba(201, 169, 97, 0.5), inset 0 0 15px rgba(0,0,0,0.4);
    color: var(--gold-bright);
    font-size: 14px;
    font-weight: bold;
    line-height: 70px;
    text-align: center;
    position: relative;
    z-index: 3;
  }

  .epoch-node::before {
    content: "✦";
    position: absolute;
    top: -8px;
    left: 50%;
    transform: translateX(-50%);
    color: var(--gold-bright);
    font-size: 16px;
  }

  .epoch-title {
    display: block;
    margin-top: 15px;
    color: var(--gold-bright);
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 1px;
  }

  .epoch-period {
    display: block;
    color: var(--text-dim);
    font-size: 13px;
    font-style: italic;
    margin-top: 3px;
  }

  /* События */
  .event {
    position: relative;
    width: 50%;
    padding: 15px 40px;
    margin-bottom: 20px;
  }

  .event.left {
    left: 0;
    text-align: right;
  }

  .event.right {
    left: 50%;
    text-align: left;
  }

  .event-node {
    position: absolute;
    top: 20px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--gold);
    border: 2px solid var(--bg-dark);
    cursor: pointer;
    transition: all 0.3s;
    z-index: 2;
  }

  .event.left .event-node {
    right: -9px;
  }

  .event.right .event-node {
    left: -9px;
  }

  .event-node:hover {
    transform: scale(1.5);
    background: var(--gold-bright);
    box-shadow: 0 0 15px var(--gold-bright);
  }

  .event-card {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 12px 15px;
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
  }

  .event-card:hover {
    border-color: var(--gold);
    box-shadow: 0 4px 15px rgba(201, 169, 97, 0.2);
    transform: translateY(-2px);
  }

  .event-year {
    color: var(--red);
    font-weight: bold;
    font-size: 15px;
    margin-bottom: 4px;
  }

  .event-title {
    color: var(--gold-bright);
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 3px;
  }

  .event-hint {
    color: var(--text-dim);
    font-size: 12px;
    font-style: italic;
  }

  /* ===== МОДАЛЬНОЕ ОКНО ===== */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.8);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    animation: fadeIn 0.3s;
  }

  .modal-overlay.active {
    display: flex;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .modal {
    background: var(--bg-panel);
    border: 2px solid var(--gold);
    border-radius: 6px;
    width: 90%;
    max-width: 700px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 30px;
    position: relative;
    box-shadow: 0 0 40px rgba(201, 169, 97, 0.3);
  }

  .modal-close {
    position: absolute;
    top: 10px; right: 15px;
    background: none;
    border: none;
    color: var(--gold);
    font-size: 28px;
    cursor: pointer;
    transition: color 0.2s;
  }

  .modal-close:hover { color: var(--red); }

  .modal h2 {
    color: var(--gold-bright);
    font-size: 22px;
    margin-bottom: 5px;
    padding-right: 30px;
  }

  .modal .modal-year {
    color: var(--red);
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 15px;
  }

  .modal .modal-location {
    color: var(--text-dim);
    font-style: italic;
    font-size: 13px;
    margin-bottom: 15px;
    padding-bottom: 15px;
    border-bottom: 1px solid var(--border);
  }

  .modal .modal-description {
    color: var(--text);
    font-size: 15px;
    line-height: 1.7;
    margin-bottom: 20px;
    text-align: justify;
  }

  .modal .sources {
    background: rgba(0,0,0,0.3);
    padding: 12px 15px;
    border-left: 3px solid var(--gold);
    border-radius: 3px;
    margin-bottom: 15px;
  }

  .modal .sources h4 {
    color: var(--gold);
    font-size: 13px;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .modal .sources a {
    display: block;
    color: var(--text-dim);
    font-size: 13px;
    text-decoration: none;
    padding: 3px 0;
    transition: color 0.2s;
  }

  .modal .sources a:hover {
    color: var(--gold-bright);
    text-decoration: underline;
  }

  .map-btn {
    display: inline-block;
    background: var(--red);
    color: var(--gold-bright);
    border: 1px solid var(--gold);
    padding: 8px 18px;
    border-radius: 3px;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
    transition: all 0.2s;
    margin-top: 5px;
  }

  .map-btn:hover {
    background: var(--gold);
    color: var(--bg-dark);
  }

  #modal-map {
    width: 100%;
    height: 350px;
    margin-top: 15px;
    border: 1px solid var(--gold);
    border-radius: 3px;
    display: none;
  }

  /* Схема богослужения */
  .service-scheme {
    background: rgba(0,0,0,0.3);
    padding: 20px;
    border: 1px solid var(--gold);
    border-radius: 4px;
    margin: 20px 0;
  }

  .service-scheme h4 {
    color: var(--gold-bright);
    font-size: 16px;
    margin-bottom: 15px;
    text-align: center;
  }

  .scheme-item {
    padding: 10px 15px;
    margin: 8px 0;
    background: rgba(201, 169, 97, 0.1);
    border-left: 3px solid var(--gold);
    border-radius: 2px;
  }

  .scheme-item.main {
    background: rgba(139, 38, 53, 0.2);
    border-left-color: var(--red);
    font-weight: bold;
  }

  .scheme-item.optional {
    background: rgba(201, 169, 97, 0.05);
    border-left-color: var(--text-dim);
    font-style: italic;
  }

  .scheme-note {
    color: var(--text-dim);
    font-size: 13px;
    margin-top: 15px;
    padding: 10px;
    background: rgba(0,0,0,0.2);
    border-radius: 3px;
    line-height: 1.6;
  }

  /* Скроллбар */
  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg-dark); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--gold); }

  @media (max-width: 768px) {
    #sidebar { width: 100%; height: auto; max-height: 40vh; }
    body { flex-direction: column; }
    .event { width: 100%; left: 0 !important; text-align: left !important; padding-left: 50px; padding-right: 15px; }
    .event .event-node { left: -9px !important; right: auto !important; }
    .timeline::before { left: 20px; }
  }
</style>
</head>
<body>

<!-- ЛЕВАЯ ПАНЕЛЬ -->
<aside id="sidebar">
  <h2>☦ СОДЕРЖАНИЕ</h2>
  <div id="tree"></div>
</aside>

<!-- ЦЕНТРАЛЬНАЯ ПАНЕЛЬ -->
<main id="main">
  <h1>ИСТОРИЯ ПРАВОСЛАВНОЙ ЦЕРКВИ</h1>
  <p class="subtitle">Интерактивная шкала событий от Пятидесятницы до наших дней</p>
  <div class="timeline" id="timeline"></div>
</main>

<!-- МОДАЛЬНОЕ ОКНО -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">×</button>
    <h2 id="modal-title"></h2>
    <div class="modal-year" id="modal-year"></div>
    <div class="modal-location" id="modal-location"></div>
    <div class="modal-description" id="modal-description"></div>
    <div id="modal-extra"></div>
    <div class="sources" id="modal-sources"></div>
    <button class="map-btn" id="map-toggle" onclick="toggleMap()">📍 Показать на карте</button>
    <div id="modal-map"></div>
  </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

        sources: [

// ============================================================
// РЕНДЕРИНГ
// ============================================================

const timeline = document.getElementById('timeline');
const tree = document.getElementById('tree');

// Рендер таймлайна
function renderTimeline() {
  let html = '';
  let side = 'left';
  DATA.forEach(epoch => {
    html += `
      <div class="epoch-marker" id="epoch-${epoch.id}">
        <div class="epoch-node">☦</div>
        <span class="epoch-title">${epoch.title}</span>
        <span class="epoch-period">${epoch.period}</span>
      </div>
    `;
    epoch.events.forEach(ev => {
      html += `
        <div class="event ${side}" id="event-${ev.id}">
          <div class="event-node" onclick="openModal('${ev.id}')"></div>
          <div class="event-card" onclick="openModal('${ev.id}')">
            <div class="event-year">${ev.year} г.</div>
            <div class="event-title">${ev.title}</div>
            <div class="event-hint">→ подробности</div>
          </div>
        </div>
      `;
      side = side === 'left' ? 'right' : 'left';
    });
  });
  timeline.innerHTML = html;
}

// Рендер дерева
function renderTree() {
  let html = '';
  DATA.forEach(epoch => {
    html += `<div class="tree-epoch">`;
    html += `<div class="tree-epoch-title" onclick="toggleEpoch(this, '${epoch.id}')">${epoch.title} <small style="color:var(--text-dim);font-weight:normal;">(${epoch.period})</small></div>`;
    html += `<ul class="tree-events" id="tree-epoch-${epoch.id}">`;
    epoch.events.forEach(ev => {
      html += `<li class="tree-event" onclick="scrollToEvent('${ev.id}')">${ev.year} — ${ev.title}</li>`;
    });
    html += `</ul></div>`;
  });
  tree.innerHTML = html;
}

function toggleEpoch(el, epochId) {
  const list = document.getElementById('tree-epoch-' + epochId);
  list.classList.toggle('open');
  const epochEl = document.getElementById('epoch-' + epochId);
  if (epochEl) epochEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function scrollToEvent(eventId) {
  const el = document.getElementById('event-' + eventId);
  if (el) {
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    document.querySelectorAll('.tree-event').forEach(e => e.classList.remove('active'));
    const treeItems = document.querySelectorAll('.tree-event');
    treeItems.forEach(item => {
      if (item.getAttribute('onclick').includes(eventId)) {
        item.classList.add('active');
      }
    });
  }
  openModal(eventId);
}

// ============================================================
// МОДАЛЬНОЕ ОКНО И КАРТА
// ============================================================

let leafletMap = null;
let currentEvent = null;

function findEvent(id) {
  for (const epoch of DATA) {
    for (const ev of epoch.events) {
      if (ev.id === id) return ev;
    }
  }
  return null;
}

function renderServiceScheme() {
  return `
    <div class="service-scheme">
      <h4>☦ Структура Всенощного бдения</h4>
      <div class="scheme-item optional">
        <strong>Малая вечерня</strong> (подготовительная, служится днём накануне воскресных и великих праздников)
      </div>
      <div class="scheme-item main">
        <strong>Великая вечерня</strong> (основная часть Всенощной)
        <div style="font-size: 12px; margin-top: 5px; font-weight: normal; color: var(--text-dim);">
          — «Благословен Бог наш...»<br>
          — Псалом 103 (предначинательный)<br>
          — Великая ектения<br>
          — «Господи, воззвах» со стихирами<br>
          — Вход с кадилом (если есть)<br>
          — «Свете тихий»<br>
          — Паремии (если праздник)<br>
          — Лития (если бдение)<br>
          — Стихиры на стиховне<br>
          — «Ныне отпущаеши» (если есть)<br>
          — Трисвятое, «Отче наш», тропари
        </div>
      </div>
      <div class="scheme-item main">
        <strong>Утреня</strong>
        <div style="font-size: 12px; margin-top: 5px; font-weight: normal; color: var(--text-dim);">
          — Шестопсалмие<br>
          — Великая ектения<br>
          — «Бог Господь» с тропарями<br>
          — Кафизмы (1-я и 2-я, если есть)<br>
          — Малая ектения, седален<br>
          — Полиелей (если праздник)<br>
          — Величание (если есть)<br>
          — Канон (или два)<br>
          — «Честнейшую» (если нет полиелея)<br>
          — Малая ектения<br>
          — Стихиры на «Хвалите»<br>
          — Великое славословие<br>
          — Отпуст
        </div>
      </div>
      <div class="scheme-item main">
        <strong>Первый час</strong>
      </div>
      <div class="scheme-note">
        <strong>Примечание о Великом повечерии:</strong><br>
        Великое повечерие НЕ входит в обычное воскресное Всенощное бдение. Оно заменяет вечерню или присоединяется к ней только в особые периоды: в дни Великого поста (с молитвой св. Ефрема Сирина), в сочельники Рождества и Крещения, а также в некоторых монастырских традициях накануне особо чтимых праздников.
      </div>

  `;
}

function openModal(id) {
  const ev = findEvent(id);
  if (!ev) return;
  currentEvent = ev;

  document.getElementById('modal-title').textContent = ev.title;
  document.getElementById('modal-year').textContent = ev.year + ' г.';
  document.getElementById('modal-location').textContent = '📍 ' + ev.location;
  document.getElementById('modal-description').textContent = ev.description;

  // Схема богослужения
  const extraDiv = document.getElementById('modal-extra');
  if (ev.hasScheme && ev.schemeType === "vespers") {
    extraDiv.innerHTML = renderServiceScheme();
  } else {
    extraDiv.innerHTML = '';
  }

  const sourcesDiv = document.getElementById('modal-sources');
  let srcHtml = '<h4>Источники:</h4>';
  ev.sources.forEach(s => {
    srcHtml += `<a href="${s.url}" target="_blank">• ${s.title}</a>`;
  });
  sourcesDiv.innerHTML = srcHtml;

  // Сброс карты
  document.getElementById('modal-map').style.display = 'none';
  document.getElementById('map-toggle').textContent = '📍 Показать на карте';
  if (leafletMap) {
    leafletMap.remove();
    leafletMap = null;
  }

  document.getElementById('modal').classList.add('active');
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
  if (leafletMap) {
    leafletMap.remove();
    leafletMap = null;
  }
}

function toggleMap() {
  const mapDiv = document.getElementById('modal-map');
  const btn = document.getElementById('map-toggle');
  if (mapDiv.style.display === 'none' || mapDiv.style.display === '') {
    mapDiv.style.display = 'block';
    btn.textContent = '🗺️ Скрыть карту';
    setTimeout(() => {
      if (!leafletMap) {
        leafletMap = L.map('modal-map').setView([currentEvent.coords.lat, currentEvent.coords.lng], 10);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '© OpenStreetMap',
          maxZoom: 18
        }).addTo(leafletMap);
        L.marker([currentEvent.coords.lat, currentEvent.coords.lng])
          .addTo(leafletMap)
          .bindPopup(`<b>${currentEvent.year} г.</b><br>${currentEvent.title}<br><i>${currentEvent.location}</i>`)
          .openPopup();
      }
      leafletMap.invalidateSize();
    }, 100);
  } else {
    mapDiv.style.display = 'none';
    btn.textContent = '📍 Показать на карте';
  }
}

// Закрытие модалки по клику вне её
document.getElementById('modal').addEventListener('click', (e) => {
  if (e.target.id === 'modal') closeModal();
});

// Закрытие по Escape
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

// Инициализация
renderTimeline();
renderTree();
</script>
